name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Integration tests
        run: go test -tags=integration -count=1 ./...
      - name: Integration race tests
        run: go test -tags=integration -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        run: npm ci --no-audit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high --fetch-retries=0 --fetch-timeout=30000 && exit 0
            test "$attempt" -eq 3 && exit 1
            sleep 10
          done

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose with placeholder values
        env:
          LEDGER_PUBLIC_URL: https://ledger.example.com
          LEDGER_POSTGRES_PASSWORD: placeholder
          LEDGER_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=2$placeholder$placeholder
          LEDGER_ADMIN_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=2$placeholder$placeholder
          LEDGER_CALENDAR_ENCRYPTION_KEY: placeholder-calendar-key-at-least-32
          LEDGER_TRUSTED_PROXY_CIDR: 203.0.113.0/24
          LEDGER_INFER_URL: http://inference.example.com/v1
        run: docker compose config --quiet
      - name: Build admin image
        run: docker build --build-arg CMD=ledger-admin -t ledger-admin:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t ledger-frontend:ci frontend

  android:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Test, lint, and build Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger-android-debug-api-${{ matrix.api }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Exercise owner flows on Android ${{ matrix.api }}
        working-directory: android
        env:
          ANDROID_API: ${{ matrix.api }}
          ANDROID_AVD_HOME: ${{ runner.temp }}/ledger-avd
        run: |
          sdkmanager 'emulator' "system-images;android-$ANDROID_API;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name ledger-ci --device pixel_2 --path "$ANDROID_AVD_HOME/ledger-ci.avd" --package "system-images;android-$ANDROID_API;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/ledger-ci.ini"
          "$ANDROID_HOME/emulator/emulator" @ledger-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then booted=1; break; fi
            sleep 2
          done
          if [[ "$booted" != 1 ]]; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          adb shell settings put system screen_off_timeout 1800000
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./smoke.sh

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-api-${{ matrix.api }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          retention-days: 14

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - name: Test native Linux client and installer
        run: |
          go test -race -count=1 -v ./cmd/ledger
          go vet ./cmd/ledger
          go build -trimpath -ldflags='-s -w -X main.version=v0.0.0' -o "$RUNNER_TEMP/ledger" ./cmd/ledger
          ./scripts/test-linux-installer.sh "$RUNNER_TEMP/ledger"

  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - name: Test Windows client in Docker and Wine
        shell: bash
        run: ./scripts/test-wine.sh 2>&1 | tee "$RUNNER_TEMP/wine-tests.log"
      - name: Upload Wine test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-test-log
          path: ${{ runner.temp }}/wine-tests.log
          retention-days: 14

  client-checks:
    if: always()
    needs: [linux, windows, wine, android, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every client test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  windows:
    uses: ./.github/workflows/windows-client.yml
