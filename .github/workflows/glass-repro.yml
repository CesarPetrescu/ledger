# Temporary, read-only reproduction snapshot for the full-app work in PR 34.
# Removed after the debugging checkpoint; no credentials or local storage included.
name: Glass reproduction snapshot
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.number == 34
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: |
          npm --prefix evenhub ci --no-audit --no-fund
          mkdir -p /tmp/glass-repro
          git archive HEAD > /tmp/glass-repro/source.tar
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='@evenrealities/evenhub-simulator' -czf /tmp/glass-repro/npm.tar.gz -C evenhub node_modules
          git rev-parse HEAD > /tmp/glass-repro/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glass-repro
          path: /tmp/glass-repro/
          retention-days: 1
