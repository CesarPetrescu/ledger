# One-time dependency-lock bootstrap for PR 34; remove after its generated commit.
name: Bootstrap Glass lockfiles
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfiles:
    if: github.event.pull_request.number == 34 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/ledger-glass-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Generate lockfiles without executing package scripts
        run: |
          npm --prefix evenhub install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix evenhub/system install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the two generated lockfiles to this PR branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/ledger-glass-foundation | cut -f1)" = "$EXPECTED_SHA"
          git add -- evenhub/package-lock.json evenhub/system/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(glass): commit generated application and system-test lockfiles'
          git push origin HEAD:refs/heads/feat/ledger-glass-foundation
