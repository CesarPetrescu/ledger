name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          go test ./cmd/ledger
          go vet ./cmd/ledger
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "dist/ledger_linux_$arch" ./cmd/ledger
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "dist/ledger_windows_$arch.exe" ./cmd/ledger
          done
      - name: Build signed Android APK
        working-directory: android
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android signing key}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing Android key alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing Android key password}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon -PreleaseVersion="${RELEASE_TAG#v}" testDebugUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../dist/ledger-android-${RELEASE_TAG}.apk"
      - name: Checksum release assets
        working-directory: dist
        run: sha256sum ledger_linux_* ledger_windows_*.exe ledger-android-*.apk > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

  install-windows:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the published Windows release
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'Ledger installation smoke'
          ./install.ps1 -InstallDir $installDir -NoPath
          $version = & (Join-Path $installDir 'ledger.exe') version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne $env:RELEASE_TAG) { throw 'Published client version is incorrect.' }

  install-linux:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the published Linux release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LEDGER_INSTALL_DIR: ${{ runner.temp }}/Ledger installation smoke
        run: |
          sh ./install.sh
          test "$("$LEDGER_INSTALL_DIR/ledger" version)" = "$RELEASE_TAG"
