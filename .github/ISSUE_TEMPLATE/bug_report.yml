name: Bug report
description: Report a reproducible defect without including private deployment data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Redact credentials, production domains, internal addresses, project content, and logs containing identifiers.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, fictional reproduction.
      placeholder: |
        1. Configure Ledger with example values
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification details
      description: List relevant tests or sanitized diagnostics. Do not paste secrets or operational identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I removed credentials, private URLs, internal addresses, account IDs, project data, and deployment identifiers.
          required: true
        - label: This report is not a security vulnerability. Security issues must use private vulnerability reporting.
          required: true
