name: Feature request
description: Propose a focused improvement using fictional examples only.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case without including real project content, infrastructure details, credentials, or identifiers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which generic use case is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest compatible change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain effects on authentication, authorization, networking, stored data, and public examples.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: This request uses only fictional values and contains no sensitive or deployment-specific data.
          required: true
