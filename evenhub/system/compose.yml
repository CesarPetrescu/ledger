# Overlay the production deployment, rather than reimplementing its services.
services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:8080"
  ledger-mcp:
    environment:
      LEDGER_STT_URL: https://glass-provider:9444/v1/audio/transcriptions
      LEDGER_STT_API_KEY: ${GLASS_PROVIDER_TOKEN}
      LEDGER_STT_MODEL: ci-boundary
      SSL_CERT_FILE: /ci-trust/localhost.crt
    volumes:
      - ${GLASS_CERT_DIR}:/ci-trust:ro
  ledger-admin:
    environment:
      SSL_CERT_FILE: /ci-trust/localhost.crt
    volumes:
      - ${GLASS_CERT_DIR}:/ci-trust:ro
  glass-provider:
    image: python:3.13-alpine
    command: ["python", "/fixture/providers.py"]
    environment:
      GLASS_PROVIDER_TOKEN: ${GLASS_PROVIDER_TOKEN}
    volumes:
      - ./evenhub/system/providers.py:/fixture/providers.py:ro
      - ${GLASS_CERT_DIR}:/certs:ro
    ports:
      - "127.0.0.1:10443:9444"
    networks:
      - ledger-internal
  glass-test-edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./evenhub/system/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${GLASS_CERT_DIR}:/certs:ro
      - ./evenhub/dist:/glass:ro
      - ./evenhub/ledger-glass.ehpk:/package/ledger-glass.ehpk:ro
    depends_on:
      - nginx
      - glass-provider
    networks:
      - ledger-internal
