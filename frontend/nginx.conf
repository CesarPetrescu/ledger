# Static operator UI. Served only through the edge proxy on the internal network.
# Hashed Vite assets are immutable; the shell document is never cached.
map $uri $ledger_cache_control {
    ~^/admin/assets/  "public, max-age=31536000, immutable";
    default           "no-store";
}

server {
    listen 8085;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $ledger_cache_control always;

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / { return 404; }
}
