map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    absolute_redirect off;
    client_max_body_size 40m;

    set_real_ip_from ${LEDGER_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Look services up on every request (Docker's DNS, cached 10s), not once at
    # startup: a service that restarts gets a new address, as after a reboot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth ledger-auth:8082;
    set $mcp ledger-mcp:8081;
    set $admin ledger-admin:8084;
    set $frontend ledger-frontend:8085;

    location = / { return 302 /admin/; }
    location = /admin { return 302 /admin/; }

    # Browsers and the OAuth approval page ask for icons at the site root.
    location ~ ^/(favicon\.ico|apple-touch-icon\.png)$ {
        proxy_pass http://$frontend/admin/$1;
        proxy_set_header Host $host;
    }

    location ^~ /admin/api {
        proxy_pass http://$admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Ledger-Client-IP $remote_addr;
    }

    location ^~ /admin/ {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /mcp {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Plain JSON API for servers holding an owner-created API key (research dispatch). A claim may
    # wait up to 25 seconds for a task, well inside the default 60-second read timeout.
    location ^~ /api/ {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Research runs: the dispatcher's endpoint and the one a single sandbox's run token works on.
    location ~ ^/mcp/(research|dispatch)$ {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Files a research run downloads and uploads with its run token, up to 25 MiB each.
    location ^~ /mcp/research/files {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Short-lived download links that agents hand to people. Ledger serves them as attachments only.
    location ^~ /files/ {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://$mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://$auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Ledger-Client-IP $remote_addr;
    }

    location ^~ /oauth/ {
        proxy_pass http://$auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Ledger-Client-IP $remote_addr;
    }

    location / { return 404; }
}
